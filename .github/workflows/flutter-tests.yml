name: Flutter Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./app

      - name: Analyze code
        run: flutter analyze
        working-directory: ./app